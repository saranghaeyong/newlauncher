plugins { id 'com.android.application' }

android {
    namespace 'com.newlauncher.tv'
    compileSdk 35

    defaultConfig {
        applicationId 'com.newlauncher.tv'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            // Debug key makes CI output directly installable for testing.
            // Replace with a private release key before public distribution.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
